{% extends "core/base.html" %}
{% load static %}

{% block principal %}
    <section id="producto-detalle" class="pt-5">
        <div class="container">
            <h2 class="text-center my-5">{{ producto.nombre }}</h2>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card shadow-lg border-light">
                        <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="card-img-top img-fluid" style="object-fit: cover; height: auto;">
                    </div>
                </div>
                
                <div class="col-md-6 mb-4">
                    <div class="card shadow-lg border-light h-100">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title mb-3">{{ producto.nombre }}</h3>
                            <p class="card-text mb-3"><strong>Descripción:</strong> {{ producto.descripcion }}</p>
                            <p class="card-text mb-3"><strong>Precio:</strong> ${{ producto.precio }}</p>
                            <p class="card-text mb-4"><strong>Stock:</strong> {{ producto.stock }}</p>
                            <div class="d-flex gap-2">
                                <a href="{% url 'agregar_al_carrito' producto.id %}" class="btn btn-success">
                                    <i class="fas fa-cart-plus"></i> Agregar al carrito 
                                </a>
                                <a href="{% url 'pago' %}" class="btn btn-primary">
                                    <i class="fas fa-shopping-cart"></i> Comprar ahora ${{ producto.precio }}
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="pt-5"></div>

{% endblock %}
